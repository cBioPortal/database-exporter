[project]
name = "cbioportal-database-exporter"
version = "0.1.0"
description = "Publish the public cBioPortal ClickHouse database to S3 and Hugging Face"
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3==1.43.83",
  "clickhouse-connect==1.7.2",
  "huggingface-hub==1.29.0",
]

[project.scripts]
database-exporter = "database_exporter.__main__:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "database_exporter"
module-root = "src"
